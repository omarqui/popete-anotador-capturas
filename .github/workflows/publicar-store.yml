# Genera el paquete MSIX de Popete, crea el Release en GitHub y lo envía a la Microsoft Store.
#
# Automático: al subir un tag vX.Y.Z (git tag v1.0.2 && git push origin v1.0.2) se genera el
# paquete X.Y.Z.0, se crea el Release y se manda a certificación.
# Manual: GitHub › Actions › "Publicar en la Microsoft Store" › Run workflow (cada paso es opcional).
#
# Requisitos para enviar a la Store (la generación del .msix y el Release no los necesitan):
#   - La app ya publicada y en vivo en la Store (la primera versión se envía a mano).
#   - Secretos:  PARTNER_CENTER_TENANT_ID, PARTNER_CENTER_SELLER_ID,
#                PARTNER_CENTER_CLIENT_ID, PARTNER_CENTER_CLIENT_SECRET
#                (app de Microsoft Entra asociada a Partner Center con rol Manager)
#   - Variable:  MSSTORE_PRODUCT_ID (el "Store ID" de Partner Center › Identidad del producto)
#   Sin ninguno de ellos, un tag igual genera el .msix y el Release, y saltea la Store con un
#   aviso: el paquete se sube a mano. (Una cuenta Individual de Partner Center no admite apps de
#   Microsoft Entra, así que no puede tener estos secretos.)
name: Publicar en la Microsoft Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del paquete: N.N.N.0, mayor que la última enviada (ej. 1.0.2.0)'
        required: true
        type: string
      crear_release:
        description: 'Crear el Release vN.N.N en GitHub con el .msix adjunto'
        type: boolean
        default: true
      enviar_store:
        description: 'Enviar el paquete a Partner Center'
        type: boolean
        default: false
      confirmar_envio:
        description: 'Mandar a certificación (si no, queda como borrador en Partner Center para revisarlo)'
        type: boolean
        default: false

permissions:
  contents: write # para crear el tag y el Release

concurrency:
  group: publicar-store
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    env:
      # Con un tag se hace todo; a mano, lo que se marque
      POR_TAG: ${{ github.event_name == 'push' }}
      CREAR_RELEASE: ${{ github.event_name == 'push' || inputs.crear_release }}
      ENVIAR_STORE: ${{ github.event_name == 'push' || inputs.enviar_store }}
      CONFIRMAR: ${{ github.event_name == 'push' || inputs.confirmar_envio }}
    steps:
      - uses: actions/checkout@v4

      - name: Determinar la versión
        shell: pwsh
        env:
          VERSION_MANUAL: ${{ inputs.version }}
        run: |
          if ($env:POR_TAG -eq 'true') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "El tag debe ser vX.Y.Z (ej. v1.0.2): $env:GITHUB_REF_NAME"
            }
            $version = "$($Matches[1]).0"
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = $env:VERSION_MANUAL
            if ($version -notmatch '^\d+\.\d+\.\d+\.0$') {
              throw "La versión debe ser N.N.N.0 (la Store exige el último número en 0): $version"
            }
            $tag = 'v' + ($version -replace '\.0$', '')
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "MSIX=artifacts/msix/Popete_$($version)_x64.msix" >> $env:GITHUB_ENV
          "Versión $version (tag $tag)"

      # Los secretos no se pueden usar en un "if:": se revisan acá y, si no hay ninguno, SALTEAR_STORE
      # apaga los pasos de la Store. Un tag sigue sin la Store; a mano con enviar_store marcado, o
      # con la configuración a medias, falla (se pidió enviar y no se puede).
      - name: Ver si hay credenciales de la Store
        if: ${{ env.ENVIAR_STORE == 'true' }}
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $nombres = [ordered]@{
            TENANT_ID = 'secreto PARTNER_CENTER_TENANT_ID'; SELLER_ID = 'secreto PARTNER_CENTER_SELLER_ID'
            CLIENT_ID = 'secreto PARTNER_CENTER_CLIENT_ID'; CLIENT_SECRET = 'secreto PARTNER_CENTER_CLIENT_SECRET'
            PRODUCT_ID = 'variable MSSTORE_PRODUCT_ID'
          }
          $faltan = @($nombres.GetEnumerator() | Where-Object { -not [Environment]::GetEnvironmentVariable($_.Key) } | ForEach-Object { $_.Value })
          if ($faltan.Count -eq 0) { 'Credenciales de la Store completas.'; return }
          if ($faltan.Count -lt $nombres.Count) {
            throw "Falta configurar en el repo: $($faltan -join ', ') (ver README › Publicar con GitHub Actions)"
          }
          if ($env:POR_TAG -ne 'true') {
            throw 'Marcaste enviar_store, pero el repo no tiene las credenciales de Partner Center (ver README › Publicar con GitHub Actions)'
          }
          'SALTEAR_STORE=true' >> $env:GITHUB_ENV
          $paquete = Split-Path $env:MSIX -Leaf
          "::warning title=No se envió a la Store::El repo no tiene credenciales de Partner Center. Sube $paquete a mano desde Partner Center."
          "### Microsoft Store`n`nNo se envió: el repo no tiene credenciales de Partner Center. Sube ``$paquete`` (está en el Release y en los artefactos de esta ejecución) desde Partner Center." >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # El mismo script que se usa a mano (README › Paquete MSIX). En el runner ya está el
      # Windows SDK, así que no descarga makeappx.
      - name: Generar el .msix para la Store
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\empaquetar-msix.ps1 -Store -Version $env:VERSION

      - name: Guardar el .msix como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: popete-msix-${{ env.VERSION }}
          path: ${{ env.MSIX }}
          if-no-files-found: error

      - name: Crear el Release en GitHub
        if: ${{ env.CREAR_RELEASE == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Con un tag, el Release usa ese tag; a mano, se crea el tag sobre este commit
          $opciones = @($env:TAG, $env:MSIX, '--title', "Popete $env:TAG", '--generate-notes')
          if ($env:POR_TAG -ne 'true') { $opciones += @('--target', $env:GITHUB_SHA) }
          gh release create @opciones
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el Release $env:TAG (¿ya existe?)" }

      - name: Instalar Microsoft Store Developer CLI
        if: ${{ env.ENVIAR_STORE == 'true' && env.SALTEAR_STORE != 'true' }}
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Enviar a Partner Center
        if: ${{ env.ENVIAR_STORE == 'true' && env.SALTEAR_STORE != 'true' }}
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          # Que estén todas las credenciales ya lo comprobó "Ver si hay credenciales de la Store"
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure falló (revisa los secretos)' }

          # Reemplaza el borrador pendiente, si lo hay, por uno nuevo con este paquete
          $opciones = @('publish', $env:MSIX, '--appId', $env:PRODUCT_ID)
          if ($env:CONFIRMAR -ne 'true') { $opciones += '--noCommit' } # queda en borrador
          msstore @opciones
          if ($LASTEXITCODE -ne 0) { throw 'msstore publish falló' }

          if ($env:CONFIRMAR -eq 'true') { "Enviado a certificación." }
          else { "Quedó como borrador: revísalo y envíalo desde Partner Center." }
